<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="main-content">
      <div class="config-container">
        <div style="position: sticky; top: 1rem">
          <select id="example-select" style="margin-bottom: 0.2rem">
            <option value="">Select an example...</option>
          </select>
          <p>Config</p>
          <div style="position: relative">
            <textarea id="config"></textarea>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="panel">
          <p>Input (<span id="input-size"></span>)</p>
          <div class="input-container">
            <div id="input-tab-group-buttons" class="tab-group-buttons"></div>
            <textarea id="input-text"></textarea>
            <textarea id="input-ast-json" style="display: none"></textarea>
            <div id="input-cfg" style="display: none" class="cfg"></div>
          </div>
        </div>
        <div class="panel">
          <p>Output (<span id="output-size"></span>)</p>
          <div class="input-container">
            <div id="output-tab-group-buttons" class="tab-group-buttons"></div>
            <textarea id="output-text" disabled></textarea>
            <textarea
              id="output-ast-json"
              disabled
              style="display: none"
            ></textarea>
            <div id="output-cfg" style="display: none" class="cfg"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./index.js" type="module"></script>
  </body>
</html>
